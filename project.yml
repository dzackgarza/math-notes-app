name: MathNotes
options:
  bundleIdPrefix: dev.zack
packages:
  MJRefresh:
    url: https://github.com/CoderMJLee/MJRefresh
    exactVersion: 3.7.9
  # Touch and stylus synthesis through UIKit's event path; private APIs, so tests only.
  Hammer:
    url: https://github.com/lyft/Hammer
    exactVersion: 0.18.0
targets:
  MathNotes:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - path: Resources/Fonts
        buildPhase: resources
      - path: core/assets/fonts/NotoSans-Regular.ttf
        buildPhase: resources
      - path: .ci/fonts/NotoSansArabic-Regular.ttf
        buildPhase: resources
      - path: .ci/fonts/NotoSansHebrew-Regular.ttf
        buildPhase: resources
      - path: .ci/fonts/NotoSansDevanagari-Regular.ttf
        buildPhase: resources
      - path: .ci/fonts/NotoSansSymbols2-Regular.ttf
        buildPhase: resources
      - path: Resources/TikZRuntime
        type: folder
      - path: Resources/TikZEditor
        type: folder
    dependencies:
      - framework: build/InkEngine.xcframework
        embed: false
      - package: MJRefresh
      - sdk: PDFKit.framework
      - sdk: WebKit.framework
      - sdk: libc++.tbd
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Math Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        UILaunchScreen: {}
        UIAppFonts:
          - AlegreyaSans-Regular.ttf
          - AlegreyaSans-Medium.ttf
          - AlegreyaSans-ExtraBold.ttf
          - Alegreya-Variable.ttf
          - NotoSans-Regular.ttf
          - NotoSansArabic-Regular.ttf
          - NotoSansHebrew-Regular.ttf
          - NotoSansDevanagari-Regular.ttf
          - NotoSansSymbols2-Regular.ttf
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.zack.mathnotes.selection-drag
            UTTypeDescription: Math Notes selection
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: dev.zack.mathnotes.selection-copy-drag
            UTTypeDescription: Math Notes selection copy
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: dev.zack.mathnotes.clipping-drag
            UTTypeDescription: Math Notes clipping
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: dev.zack.mathnotes.page-overview-drag
            UTTypeDescription: Math Notes page
            UTTypeConformsTo:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zack.mathnotes
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - MathNotesTests
  MathNotesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - AppTests
    dependencies:
      - target: MathNotes
      - framework: build/InkEngine.xcframework
        embed: false
      - package: Hammer
      - sdk: libc++.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
