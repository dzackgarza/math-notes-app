name: MathNotes

options:
  bundleIdPrefix: dev.zack

packages:
  MJRefresh:
    url: https://github.com/CoderMJLee/MJRefresh
    exactVersion: 3.7.9

targets:
  MathNotes:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/TikZRuntime
        type: folder
      - path: Resources/TikZEditor
        type: folder
    dependencies:
      - framework: build/InkEngine.xcframework
        embed: false
      - package: MJRefresh
      - sdk: PDFKit.framework
      - sdk: WebKit.framework
      - sdk: libc++.tbd
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Math Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        UILaunchScreen: {}
        UIAppFonts:
          - AlegreyaSans-Regular.ttf
          - AlegreyaSans-Medium.ttf
          - AlegreyaSans-ExtraBold.ttf
          - Alegreya-Variable.ttf
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zack.mathnotes
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - MathNotesTests

  MathNotesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - AppTests
    dependencies:
      - target: MathNotes
      - framework: build/InkEngine.xcframework
        embed: false
      - sdk: libc++.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
