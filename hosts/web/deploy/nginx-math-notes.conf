# Math Notes web app: include inside a `server` block. `just web-deploy` puts
# the site in /var/www/math-notes. Every file revalidates;
# Workbox (sw.js) owns the offline cache.
location /math-notes/ {
    root /var/www;
    try_files $uri $uri/ /math-notes/index.html;
    add_header Cache-Control "no-cache";
}
