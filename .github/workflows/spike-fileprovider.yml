name: Spike - File Provider in the iPad Simulator

on:
  push:
    branches: [spike/fileprovider-sim]

jobs:
  spike:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spikes/fileprovider-sim
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Boot an iPad Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid')
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run the dataless read test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FPSpike.xcodeproj \
            -scheme FPSpikeHost \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"

      - name: PluginKit registration of the extension
        if: ${{ !cancelled() }}
        run: |
          xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" pluginkit -mAvvv -p com.apple.fileprovider-nonui
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/FPSpikeHost.app' -maxdepth 6 | head -1)
          codesign -d --entitlements - "$app/PlugIns/FPSpikeExtension.appex"
          plutil -p "$app/PlugIns/FPSpikeExtension.appex/Info.plist"
          xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" log show --last 10m --style compact \
            --predicate 'process == "pkd" OR subsystem == "com.apple.PlugInKit" OR eventMessage CONTAINS[c] "fpspike"' \
            | grep -iE "fpspike|reject|ignor|sandbox|invalid|fileprovider" | tail -80

      - name: File Provider logs
        if: ${{ !cancelled() }}
        run: |
          xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" log show --last 10m --style compact \
            --predicate 'process == "fileproviderd" OR process CONTAINS "FPSpike" OR eventMessage CONTAINS "FPSpike"' | grep -iE "FPSpike|error|fail|denied|entitle|fetch|domain" | tail -150
