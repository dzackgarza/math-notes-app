name: Build iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Sources/**
      - AppTests/**
      - core/**
      - hosts/web/build-tikz.mjs
      - hosts/web/ipad-figure-generator.js
      - hosts/web/tikz-embed.html
      - Resources/TikZRuntime/**
      - Resources/Fonts/**
      - tests/documents/**
      - project.yml
      - sidestore-source.jq
      - .github/workflows/ios.yml

# The build runs alongside Engine (wasm32); only publishing waits for its wasm check.
permissions:
  contents: write
  checks: read
# Releases must land in run order so the newest one is "latest".
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}
  BUILD: ${{ github.run_number }}
  TAG: v${{ github.run_number }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150

    env:
      SKIA_DIR: ${{ github.workspace }}/.ci/skia
      VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.ci/vcpkg-bin,readwrite
      # CMake reads these at configure time for the engine and Catch2 builds.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ci/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # Left shut down: parallel app tests clone it, and Catch2 boots it afterwards.
      - name: Pick an iPad Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: brew install xcodegen ninja ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ios-${{ github.sha }}
          restore-keys: ccache-ios-

      # Restore and save are separate so a later failing step keeps the build.
      - name: Restore iOS Skia build
        id: skia-cache
        uses: actions/cache/restore@v6
        with:
          path: &skia-paths |
            ${{ env.SKIA_DIR }}/include
            ${{ env.SKIA_DIR }}/modules
            ${{ env.SKIA_DIR }}/src
            ${{ env.SKIA_DIR }}/out/device/*.a
            ${{ env.SKIA_DIR }}/out/simulator/*.a
          key: skia-ios-${{ hashFiles('core/scripts/build-skia-ios.sh') }}

      - name: Build Skia for iOS
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          core/scripts/build-skia-ios.sh "$SKIA_DIR" device
          core/scripts/build-skia-ios.sh "$SKIA_DIR" simulator

      - name: Save iOS Skia build
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *skia-paths
          key: ${{ steps.skia-cache.outputs.cache-primary-key }}

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ci/vcpkg-bin
          key: vcpkg-ios-${{ hashFiles('core/vcpkg.json', 'core/triplets/**') }}

      - name: Read the Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -s '\n ' '-')" >> "$GITHUB_OUTPUT"

      # A Swift-only change reuses the engine framework built for the same core and Xcode.
      - name: Restore engine xcframework
        id: engine-cache
        uses: actions/cache/restore@v6
        with:
          path: build/InkEngine.xcframework
          key: ios-engine-${{ steps.xcode.outputs.version }}-${{ hashFiles('core/**') }}

      - name: Set up vcpkg for the engine build
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: &vcpkg-setup |
          git clone -q https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          mkdir -p "$(dirname "$VCPKG_ROOT")/vcpkg-bin"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build engine xcframework
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: core/scripts/build-ios-xcframework.sh "$SKIA_DIR" "$VCPKG_ROOT"

      - name: Save engine xcframework
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/InkEngine.xcframework
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}

      - uses: oven-sh/setup-bun@v2

      # build-tikz.mjs pins every source revision it fetches.
      - name: Restore iPad TikZ resources
        id: tikz-cache
        uses: actions/cache/restore@v6
        with:
          path: &tikz-paths |
            Resources/TikZEditor
            Resources/TikZRuntime/figure-generator.js
          key: ios-tikz-${{ hashFiles('hosts/web/build-tikz.mjs', 'hosts/web/tikz-embed.html', 'hosts/web/ipad-figure-generator.js') }}

      - name: Build iPad TikZ resources
        if: steps.tikz-cache.outputs.cache-hit != 'true'
        run: node hosts/web/build-tikz.mjs Resources/TikZEditor Resources/TikZRuntime

      - name: Save iPad TikZ resources
        if: steps.tikz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *tikz-paths
          key: ${{ steps.tikz-cache.outputs.cache-primary-key }}

      - name: Generate Xcode project
        run: xcodegen generate

      # App tests run before the slower Catch2 build so their failures surface first.
      - name: Test the app's engine link on the iPad Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project MathNotes.xcodeproj \
            -scheme MathNotes \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: Set up vcpkg for the Catch2 build
        if: ${{ !cancelled() && steps.engine-cache.outputs.cache-hit == 'true' }}
        run: *vcpkg-setup

      - name: Run the engine Catch2 tests in the iPad Simulator
        if: ${{ !cancelled() }}
        run: core/scripts/test-ios-simulator.sh "$SKIA_DIR" "$VCPKG_ROOT" "${{ steps.simulator.outputs.udid }}"

      - name: Save compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ios-${{ github.sha }}

      - name: Save iOS dependency cache
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ci/vcpkg-bin
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MathNotes.xcodeproj \
            -scheme MathNotes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MathNotes.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      - name: Make unsigned IPA
        run: |
          mkdir Payload
          cp -R "$RUNNER_TEMP/MathNotes.xcarchive/Products/Applications/MathNotes.app" Payload/
          zip -qr MathNotes.ipa Payload

      # SideStore rejects an IPA whose Info.plist differs from its source entry.
      - name: Check IPA version matches the source entry
        run: |
          plist=Payload/MathNotes.app/Info.plist
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          test "$(read_key CFBundleShortVersionString)" = "$VERSION"
          test "$(read_key CFBundleVersion)" = "$BUILD"
          test "$(read_key CFBundleIdentifier)" = dev.zack.mathnotes

      - name: Write SideStore source
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg build "$BUILD" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson size "$(stat -f %z MathNotes.ipa)" \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            -f sidestore-source.jq > source.json

      # A release requires a successful Engine (wasm32) wasm check for this revision.
      # Any successful run counts; a newer run still in progress does not hide it.
      - name: Wait for the engine tests of the release revision
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?check_name=wasm&filter=all" --jq '
              [.check_runs[] | select(.app.slug == "github-actions")] as $runs
              | if any($runs[]; .conclusion == "success") then "success"
                elif any($runs[]; .status != "completed") then "pending"
                else "failure" end')
            echo "Engine (wasm32) for $SOURCE_SHA: $state"
            case $state in
              success) break ;;
              pending) sleep 30 ;;
              *) exit 1 ;;
            esac
          done

      # Re-running a run reuses its number, so replace that release's assets.
      - name: Publish IPA and source as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MathNotes.ipa source.json --clobber
          else
            gh release create "$TAG" MathNotes.ipa source.json --latest --target "$SOURCE_SHA" \
              --title "$VERSION ($SOURCE_SHA)" \
              --notes "Unsigned; install with SideStore."
          fi

      - name: Check published source serves this build
        if: github.ref == 'refs/heads/main'
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/source.json"
          test "$(curl -fsSL "$url" | jq -r '.apps[0].versions[0].buildVersion')" = "$BUILD"
          ipa=$(jq -r '.apps[0].versions[0].downloadURL' source.json)
          test "$(curl -fsSL "$ipa" | wc -c | tr -d ' ')" = "$(stat -f %z MathNotes.ipa)"
