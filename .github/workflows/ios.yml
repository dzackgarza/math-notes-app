name: Build iPad IPA

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Engine (wasm32)
    types:
      - completed
    branches:
      - main
permissions:
  contents: write
  checks: read
# Releases must land in run order so the newest one is "latest".
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}
  BUILD: ${{ github.run_number }}
  TAG: v${{ github.run_number }}

jobs:
  engine-check:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.engine.outputs.sha }}
    steps:
      - name: Require successful engine tests for the release revision
        id: engine
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            const { data } = await github.rest.checks.listForRef({
              ...context.repo, ref: sha, check_name: 'wasm', filter: 'latest',
            });
            const check = data.check_runs.find(run => run.app.slug === 'github-actions');
            if (!check || check.status !== 'completed' || check.conclusion !== 'success') {
              throw new Error(`Engine (wasm32) must pass for ${sha} before starting the iPad build.`);
            }
            core.setOutput('sha', sha);
  build:
    needs: engine-check
    runs-on: macos-26
    timeout-minutes: 150

    env:
      SKIA_DIR: ${{ github.workspace }}/.ci/skia
      VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.ci/vcpkg-bin,readwrite

      SOURCE_SHA: ${{ needs.engine-check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

        with:
          ref: ${{ needs.engine-check.outputs.sha }}
      - name: Install tools
        run: brew install xcodegen ninja

      # Restore and save are separate so a later failing step keeps the build.
      - name: Restore iOS Skia build
        id: skia-cache
        uses: actions/cache/restore@v6
        with:
          path: &skia-paths |
            ${{ env.SKIA_DIR }}/include
            ${{ env.SKIA_DIR }}/modules
            ${{ env.SKIA_DIR }}/src
            ${{ env.SKIA_DIR }}/out/device/*.a
            ${{ env.SKIA_DIR }}/out/simulator/*.a
          key: skia-ios-${{ hashFiles('core/scripts/build-skia-ios.sh') }}

      - name: Build Skia for iOS
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          core/scripts/build-skia-ios.sh "$SKIA_DIR" device
          core/scripts/build-skia-ios.sh "$SKIA_DIR" simulator

      - name: Save iOS Skia build
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *skia-paths
          key: ${{ steps.skia-cache.outputs.cache-primary-key }}

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ci/vcpkg-bin
          key: vcpkg-ios-${{ hashFiles('core/vcpkg.json', 'core/triplets/**') }}

        id: vcpkg-cache
      - name: Set up vcpkg
        run: |
          git clone -q https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          mkdir -p "$(dirname "$VCPKG_ROOT")/vcpkg-bin"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build engine xcframework
        run: core/scripts/build-ios-xcframework.sh "$SKIA_DIR" "$VCPKG_ROOT"

      - name: Save iOS dependency cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ci/vcpkg-bin
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - uses: oven-sh/setup-bun@v2

      - name: Build iPad TikZ resources
        run: node hosts/web/build-tikz.mjs Resources/TikZEditor Resources/TikZRuntime

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPad Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run the engine Catch2 tests in the iPad Simulator
        run: core/scripts/test-ios-simulator.sh "$SKIA_DIR" "$VCPKG_ROOT" "${{ steps.simulator.outputs.udid }}"

      - name: Test the app's engine link on the iPad Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project MathNotes.xcodeproj \
            -scheme MathNotes \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MathNotes.xcodeproj \
            -scheme MathNotes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MathNotes.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      - name: Make unsigned IPA
        run: |
          mkdir Payload
          cp -R "$RUNNER_TEMP/MathNotes.xcarchive/Products/Applications/MathNotes.app" Payload/
          zip -qr MathNotes.ipa Payload

      # SideStore rejects an IPA whose Info.plist differs from its source entry.
      - name: Check IPA version matches the source entry
        run: |
          plist=Payload/MathNotes.app/Info.plist
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          test "$(read_key CFBundleShortVersionString)" = "$VERSION"
          test "$(read_key CFBundleVersion)" = "$BUILD"
          test "$(read_key CFBundleIdentifier)" = dev.zack.mathnotes

      - name: Write SideStore source
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg build "$BUILD" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson size "$(stat -f %z MathNotes.ipa)" \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            -f sidestore-source.jq > source.json

      # Re-running a run reuses its number, so replace that release's assets.
      - name: Publish IPA and source as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MathNotes.ipa source.json --clobber
          else
            gh release create "$TAG" MathNotes.ipa source.json --latest --target "$SOURCE_SHA" \
              --title "$VERSION ($SOURCE_SHA)" \
              --notes "Unsigned; install with SideStore."
          fi

      - name: Check published source serves this build
        if: github.ref == 'refs/heads/main'
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/source.json"
          test "$(curl -fsSL "$url" | jq -r '.apps[0].versions[0].buildVersion')" = "$BUILD"
          ipa=$(jq -r '.apps[0].versions[0].downloadURL' source.json)
          test "$(curl -fsSL "$ipa" | wc -c | tr -d ' ')" = "$(stat -f %z MathNotes.ipa)"
