name: Web app
# Called by engine.yml with the engine module it built (artifact engine-module).
on:
  workflow_call:
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hosts/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: engine-module
          path: hosts/web/src/engine/wasm
      - name: Restore the Flutter web build
        id: flutter-cache
        uses: actions/cache@v6
        with:
          path: hosts/web/flutter/build/web
          key: flutter-web-${{ hashFiles('hosts/web/flutter/**', 'hosts/web/src/**', 'hosts/web/bun.lock', 'hosts/web/package.json', 'hosts/web/vite.flutter.config.ts', 'hosts/web/tsconfig*.json', 'hosts/web/tikz-embed.html', 'hosts/web/build-tikz.mjs', 'hosts/web/flutter-cache.mjs', 'core/cmake/TextFonts.cmake', 'justfile') }}
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - uses: extractions/setup-just@v4
        if: steps.flutter-cache.outputs.cache-hit != 'true'
      - name: Build Flutter host
        working-directory: .
        run: just _flutter-host
        if: steps.flutter-cache.outputs.cache-hit != 'true'
      # The deployment: `just web-fetch` copies it to this machine's nginx.
      - uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: hosts/web/flutter/build/web/
          if-no-files-found: error
      - name: Vitest Browser Mode in Chromium
        run: bunx vitest run
  # The Playwright workflows, in shards that each deploy the web app to their
  # own nginx.
  workflows:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: hosts/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: web-app
          path: hosts/web/flutter/build/web
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Deploy to nginx
        run: |
          sudo apt-get install -y nginx poppler-utils qpdf
          sudo mkdir -p /var/www/math-notes
          sudo cp -r flutter/build/web/. /var/www/math-notes/
          printf 'server {\n  listen 80 default_server;\n  include %s;\n}\n' "$PWD/deploy/nginx-math-notes.conf" \
            | sudo tee /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
      - name: Playwright against the deployment
        run: bunx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results-${{ matrix.shard }}
          path: hosts/web/test-results
